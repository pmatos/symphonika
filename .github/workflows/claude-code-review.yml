name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Skip bot-authored PRs (e.g. Dependabot): secrets are withheld from such
    # runs and claude-code-action rejects non-human actors, so the job can only fail.
    if: ${{ github.event.pull_request.user.type != 'Bot' }}

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        # This reviewer is advisory. Provider outages and quota exhaustion must
        # not turn an otherwise healthy pull request red.
        continue-on-error: true
        uses: anthropics/claude-code-action@56cf60fde42f7b19c3abfd5c9c48b69a1288461f # v1.0.222
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: '--model claude-sonnet-5 --allowedTools "Agent,Task,Read,Grep,Glob,Bash(gh:*),Bash(git:*),mcp__github_inline_comment__create_inline_comment"'
          prompt: "/code-review xhigh --comment ${{ github.event.pull_request.number }}"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: Report unavailable review
        if: ${{ steps.claude-review.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::warning::Claude Code Review was unavailable; this advisory failure does not indicate a pull request code failure."
          {
            echo "### Claude Code Review unavailable"
            echo
            echo "The advisory review could not be completed. This does not indicate a pull request code or CI failure; inspect the failed review step for the external service error."
          } >> "$GITHUB_STEP_SUMMARY"
