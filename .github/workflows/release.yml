name: Release

on:
  push:
    tags:
      - "v*"
  workflow_call: &tag_input
    inputs:
      tag:
        description: Release tag to build and publish (e.g. v0.1.5)
        required: true
        type: string
  workflow_dispatch: *tag_input

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify tag matches package.json version
        run: |
          tag_version="${RELEASE_TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::tag ${RELEASE_TAG} (version ${tag_version}) does not match package.json version ${package_version}" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${package_version}" >>"$GITHUB_ENV"

      - run: npm run build

      - name: Package release artifact
        run: |
          set -euo pipefail
          stage_dir="$(mktemp -d)/symphonika-${RELEASE_VERSION}"
          mkdir -p "$stage_dir"
          cp -r dist "$stage_dir/dist"
          cp package.json package-lock.json "$stage_dir/"
          tarball="symphonika-${RELEASE_VERSION}.tar.gz"
          tar -czf "$tarball" -C "$(dirname "$stage_dir")" "symphonika-${RELEASE_VERSION}"
          sha256sum "$tarball" >SHA256SUMS.txt
          echo "TARBALL=${tarball}" >>"$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --generate-notes \
            "${TARBALL}" \
            SHA256SUMS.txt
