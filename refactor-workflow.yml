workflow:
  name: characterization_gated_refactor
  initial: red_team
  states:
    red_team:
      action:
        kind: agent
        provider: codex
        prompt: prompts/red-team.md
      transitions:
        - to: blocked
          when:
            claim_status: blocked
        - to: refactoring
          when:
            claim_status: success
            provider_success: true
            branch_advanced_since_attempt_start: true
            branch_ahead_of_base: true
        - to: blocked
    refactoring:
      action:
        kind: agent
        provider: codex
        prompt: prompts/refactor.md
      transitions:
        - to: blocked
          when:
            claim_status: blocked
        - to: verifying
          when:
            claim_status: success
            provider_success: true
            branch_advanced_since_attempt_start: true
            branch_ahead_of_base: true
        - to: blocked
    verifying:
      action:
        kind: agent
        provider: codex
        prompt: prompts/verify.md
      transitions:
        - to: blocked
          when:
            claim_status: blocked
        - to: done
          when:
            claim_status: success
            provider_success: true
        - to: blocked
    done:
      terminal: success
    blocked:
      terminal: blocked
