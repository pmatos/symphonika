state:
  root: ./.symphonika

polling:
  interval_ms: 30000

watchdog:
  enabled: true
  grace_minutes: 30
  sample_interval_seconds: 60

# Automatic Routine Firing workspace reclamation. Successful workspaces have
# a short inspection window; failed/cancelled workspaces retain longer
# forensic value. State-root logs and prompt evidence are never removed.
retention:
  routine_workspaces:
    enabled: true
    succeeded_days: 1
    failed_days: 14
    cancelled_days: 14

# Optional global cap on the total number of concurrent provider runs across
# all projects. Omit (or comment out) for unbounded. See ADR 0053.
# global:
#   max_in_flight: 8

# When true, the daemon periodically checks GitHub Releases for a newer
# Symphonika version, stages and smoke-checks it in isolation, drains
# in-flight work, and cuts over with a systemctl-driven restart. Disabled by
# default. See ADR 0079.
self_update: false

# Optional best-effort Routine Firing, terminal issue Run, and daemon-health
# notifications (ADR 0067 / ADR 0071). The password value comes only from the
# named environment variable.
# email:
#   from: "symphonika@example.com"
#   to: "operator@example.com"
#   on: changes
#   digest_window_seconds: 60
#   sources:
#     routine_firings: true
#     issue_runs: true
#     daemon_health: true
#   smtp_host: "smtp.postmarkapp.com"
#   smtp_security: starttls
#   smtp_port: 587
#   smtp_username: "<postmark-server-token>"
#   smtp_password_env: "SYMPHONIKA_SMTP_PASSWORD"

# Optional Routine execution defaults. A Routine's Markdown front matter wins;
# when both levels omit a value, the provider command below stays as authored.
# routine_defaults:
#   model: claude-sonnet-5
#   effort: high
#   permission_mode: bypass
#   timeout_minutes: 60

# Provider commands may reference {{model}} and {{effort}} — plain tags
# substitute the resolved value; the {{#tag}}...{{/tag}} section form omits
# the enclosed text entirely when the field isn't resolved for a given call
# (issue Runs never resolve these, so sections always collapse to nothing for
# them). permission_mode is deliberately not templated here: every command
# below already hardcodes full-permission execution unconditionally, so
# permission_mode: bypass is redundant rather than inert. See ADR 0067.
providers:
  codex:
    command: 'codex -p symphonika -c sandbox_mode=danger-full-access -c approval_policy=never {{#model}}-c model="{{model}}" {{/model}}{{#effort}}-c model_reasoning_effort="{{effort}}" {{/effort}}--dangerously-bypass-approvals-and-sandbox app-server'
  claude:
    command: "claude -p {{#model}}--model {{model}} {{/model}}{{#effort}}--effort {{effort}} {{/effort}}--dangerously-skip-permissions --verbose --input-format stream-json --output-format stream-json"
  omp:
    command: "omp --mode rpc --auto-approve {{#model}}--model {{model}} {{/model}}{{#effort}}--thinking {{effort}} {{/effort}}"

projects:
  - name: symphonika
    disabled: false
    weight: 1
    # Per-project cap on the number of concurrent provider runs for this
    # project. Default 1 (legacy serial behavior). Setting >1 requires a
    # per-project shared bare-repo fetch lock — see ADR 0053. Omit (or
    # leave commented) to keep the default.
    # max_in_flight: 1
    # Verification-heavy Projects can lengthen the daemon Watchdog grace.
    # enabled, sample_interval_seconds, and mtime_ignore remain daemon-scoped.
    # watchdog:
    #   grace_minutes: 180
    tracker:
      kind: github
      owner: pmatos
      repo: symphonika
      token: "$GITHUB_TOKEN"
    issue_filters:
      states: ["open"]
      labels_all: ["agent-ready"]
      labels_none: ["blocked", "needs-human", "sym:stale"]
    priority:
      labels:
        "priority:critical": 0
        "priority:high": 1
        "priority:medium": 2
        "priority:low": 3
      default: 99
    workspace:
      root: ./.symphonika/workspaces/symphonika
      git:
        remote: git@github.com:pmatos/symphonika.git
        base_branch: main
      # hooks:
      #   after_create:
      #     command: "npm ci"
      #     timeout_ms: 600000
      #   before_run:
      #     command: "./scripts/bootstrap.sh"
      #   after_run:
      #     command: "npm test"
      #   before_remove:
      #     command: "./scripts/archive-evidence.sh"
    agent:
      provider: codex
    workflow: ./WORKFLOW.md

  # Dedicated Dispatch Project for the refactor-audit Routine below. Its own
  # eligibility label keeps risk-ranked refactor issues out of the Workflow
  # above, and its raw-FSM Workflow composes builtin:refactor-swarm. Uncomment
  # this together with the `routines:` block at the bottom of this file.
  # - name: symphonika-refactors
  #   tracker:
  #     kind: github
  #     owner: pmatos
  #     repo: symphonika
  #     token: "$GITHUB_TOKEN"
  #   issue_filters:
  #     states: ["open"]
  #     labels_all: ["refactor-ready"]
  #     labels_none: ["blocked", "needs-human", "sym:stale"]
  #   priority:
  #     labels:
  #       "priority:critical": 0
  #       "priority:high": 1
  #       "priority:medium": 2
  #       "priority:low": 3
  #     default: 99
  #   workspace:
  #     root: ./.symphonika/workspaces/symphonika-refactors
  #     git:
  #       remote: git@github.com:pmatos/symphonika.git
  #       base_branch: main
  #   agent:
  #     provider: codex
  #   workflow: ./refactor-workflow.yml

# Routines live at service level and target an explicit, non-empty Project list.
# The old singular `project:` field and nested Project `routines:` lists are invalid.
# Per-Routine overrides use the same model, effort, permission_mode, and
# timeout_minutes keys in the referenced Markdown file's YAML front matter,
# delivered via the {{tag}} template placeholders in the provider commands
# above (see ADR 0067) — not appended by Symphonika itself. Claude Routine
# Firings also receive the one-shot anti-backgrounding guards.
# routines:
#   # Targets the commented-out `symphonika-refactors` Project above; a
#   # routines entry naming an undeclared Project fails the reload.
#   - path: ./routines/refactor-audit.md
#     projects: [symphonika-refactors]
