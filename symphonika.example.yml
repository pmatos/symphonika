state:
  root: ./.symphonika

polling:
  interval_ms: 30000

watchdog:
  enabled: true
  grace_minutes: 30
  sample_interval_seconds: 60

# Optional global cap on the total number of concurrent provider runs across
# all projects. Omit (or comment out) for unbounded. See ADR 0053.
# global:
#   max_in_flight: 8

# Service-level fallback for per-routine model/effort/permission_mode/
# timeout_minutes (a routine's own front matter wins per-field; omitting this
# block entirely means no defaults and no wall-clock timeout). See ADR 0067.
# routine_defaults:
#   permission_mode: bypass
#   timeout_minutes: 60

# Provider commands may reference {{model}}, {{effort}}, and
# {{permission_mode}} — plain tags substitute the resolved value; the
# {{#tag}}...{{/tag}} section form omits the enclosed text entirely when the
# field isn't resolved for a given call (issue Runs never resolve these, so
# sections always collapse to nothing for them). See SPEC §5.1 / ADR 0067.
providers:
  codex:
    command: 'codex -p symphonika -c sandbox_mode=danger-full-access -c approval_policy=never {{#model}}-c model="{{model}}" {{/model}}{{#effort}}-c model_reasoning_effort="{{effort}}" {{/effort}}--dangerously-bypass-approvals-and-sandbox app-server'
  claude:
    command: "claude -p {{#model}}--model {{model}} {{/model}}{{#effort}}--effort {{effort}} {{/effort}}--dangerously-skip-permissions --verbose --input-format stream-json --output-format stream-json"
  omp:
    command: "omp --mode rpc --auto-approve"

projects:
  - name: symphonika
    disabled: false
    weight: 1
    # Per-project cap on the number of concurrent provider runs for this
    # project. Default 1 (legacy serial behavior). Setting >1 requires a
    # per-project shared bare-repo fetch lock — see ADR 0053. Omit (or
    # leave commented) to keep the default.
    # max_in_flight: 1
    # Verification-heavy Projects can lengthen the daemon Watchdog grace.
    # enabled, sample_interval_seconds, and mtime_ignore remain daemon-scoped.
    # watchdog:
    #   grace_minutes: 180
    tracker:
      kind: github
      owner: pmatos
      repo: symphonika
      token: "$GITHUB_TOKEN"
    issue_filters:
      states: ["open"]
      labels_all: ["agent-ready"]
      labels_none: ["blocked", "needs-human", "sym:stale"]
    priority:
      labels:
        "priority:critical": 0
        "priority:high": 1
        "priority:medium": 2
        "priority:low": 3
      default: 99
    workspace:
      root: ./.symphonika/workspaces/symphonika
      git:
        remote: git@github.com:pmatos/symphonika.git
        base_branch: main
      # hooks:
      #   after_create:
      #     command: "npm ci"
      #     timeout_ms: 600000
      #   before_run:
      #     command: "./scripts/bootstrap.sh"
      #   after_run:
      #     command: "npm test"
      #   before_remove:
      #     command: "./scripts/archive-evidence.sh"
    agent:
      provider: codex
    workflow: ./WORKFLOW.md
